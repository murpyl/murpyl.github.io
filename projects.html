---
layout: default
title: PROJECTS
---
<table border="1" cellpadding="6" cellspacing="0" width="100%">
<tr bgcolor="#CCCCCC">
<th align="left">Image</th>
<th align="left">Project</th>
<th align="left">Description</th>
</tr>
{% for p in site.data.projects %}
<tr>
<td width="160">{% if p.image %}<img src="{{ p.image | relative_url }}" alt="{{ p.title }}" width="150">{% endif %}</td>
<td><b>{{ p.title }}</b></td>
<td>{{ p.description }}</td>
</tr>
{% endfor %}
</table>
