- title: NeuronBench
  url: https://github.com/murpyl/NeuronBench
  description: Benchmark on whether current LLMs can determine the impact of a neuron-level intervention on Qwen3-0.6B given the logit-lens output. We design two evals, one to see if models can guess which output came from steering the neuron rather than a random direction of similar size (eval "Which output is it?"), and one to determine whether a neuron's effect is real by beating 95% of random directions' vocabulary mass (eval "Real or null?").
  image: images/headline.png
